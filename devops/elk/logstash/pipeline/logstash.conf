###############################################################################
# logstash.conf — the pipeline definition
#
# Every Logstash pipeline has the same three stages:
#
#   input  { }   where events come FROM
#   filter { }   how each event is parsed / reshaped / enriched
#   output { }   where events go TO
#
# This is the stage that distinguishes ELK from simpler log shippers: the
# filter block turns unstructured log LINES into structured FIELDS you can
# search and aggregate on.
###############################################################################

input {
  # Receive events from Filebeat over the Beats protocol.
  beats {
    port => 5044
  }
}

filter {
  # --------------------------------------------------------------------------
  # Docker writes each log line as a JSON object. Unwrap it so the actual
  # message is available as a field instead of a blob of JSON text.
  # --------------------------------------------------------------------------
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }

  # --------------------------------------------------------------------------
  # Tag events from the portfolio container so they are easy to filter in
  # Kibana with:  container.name: portfolio
  # --------------------------------------------------------------------------
  if [container][name] == "portfolio" {
    mutate {
      add_field => { "application" => "portfolio" }
      add_tag   => [ "portfolio" ]
    }
  }

  # --------------------------------------------------------------------------
  # Classify severity. Next.js does not emit a structured level, so derive one
  # from the text. grok/regex matching like this is the classic Logstash job.
  # --------------------------------------------------------------------------
  if [message] =~ /(?i)\b(error|exception|failed|fatal)\b/ {
    mutate { add_field => { "log_level" => "ERROR" } }
  } else if [message] =~ /(?i)\b(warn|warning|deprecated)\b/ {
    mutate { add_field => { "log_level" => "WARN" } }
  } else {
    mutate { add_field => { "log_level" => "INFO" } }
  }

  # --------------------------------------------------------------------------
  # Drop Filebeat's own bookkeeping fields to keep documents small.
  # --------------------------------------------------------------------------
  mutate {
    remove_field => [ "agent", "ecs", "input", "[host][os]" ]
  }
}

output {
  # --------------------------------------------------------------------------
  # Write to Elasticsearch, one index per day. Daily indices make retention
  # trivial: deleting old data is deleting whole indices rather than running
  # expensive per-document deletes.
  # --------------------------------------------------------------------------
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "portfolio-logs-%{+YYYY.MM.dd}"
  }

  # Uncomment while debugging the pipeline to see parsed events in
  # `docker compose logs logstash`.
  # stdout { codec => rubydebug }
}
