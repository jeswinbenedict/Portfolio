name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Prepare static output directory
        run: |
          mkdir -p ./out/_next/static
          touch ./out/.nojekyll

          # Copy prerendered HTML and static assets from .next build
          if [ -d "./.next/server/app" ]; then
            cp -r ./.next/server/app/*.html ./out/ 2>/dev/null || true
            cp -r ./.next/server/app/*.ico ./out/ 2>/dev/null || true
            cp -r ./.next/server/app/*.svg ./out/ 2>/dev/null || true
            cp -r ./.next/server/app/*.txt ./out/ 2>/dev/null || true
          fi

          if [ -d "./.next/static" ]; then
            cp -r ./.next/static/* ./out/_next/static/ 2>/dev/null || true
          fi

          # Ensure 404 fallback exists for GitHub Pages client routing
          if [ -f "./out/_not-found.html" ] && [ ! -f "./out/404.html" ]; then
            cp ./out/_not-found.html ./out/404.html
          fi

          # Copy public static media
          if [ -d "./public" ]; then
            cp -rn ./public/* ./out/ 2>/dev/null || true
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
