# inventory.ini — the list of machines Ansible manages.
#
# An inventory answers two questions: WHICH hosts, and HOW to reach them.
# Hosts are grouped in [brackets]; a playbook then targets a group by name.

###############################################################################
# local — your own machine, reached without SSH.
#
# `ansible_connection=local` makes Ansible run commands directly instead of
# opening a network connection. This is what lets you practise the entire
# playbook OFFLINE, with no AWS account and no internet.
###############################################################################
[local]
localhost ansible_connection=local

###############################################################################
# webservers — the real EC2 instance.
#
# Fill in ansible_host after `terraform apply`. Terraform prints the exact
# line to paste here:
#
#   cd ../terraform && terraform output -raw ansible_inventory_line
#
# Leave it commented out while working offline; the [local] group above is
# enough to exercise the whole playbook.
###############################################################################
[webservers]
# portfolio ansible_host=REPLACE_WITH_EC2_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/portfolio

###############################################################################
# Variables applied to every host in [webservers].
###############################################################################
[webservers:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
