# ansible.cfg — settings Ansible picks up automatically when you run a
# playbook from this directory. Without it you would have to pass the same
# flags on every command.

[defaults]
# Where to find the list of managed machines.
inventory = inventory.ini

# Do not prompt "are you sure you want to continue connecting?" the first time
# a host is seen. Convenient for short-lived lab servers whose IP changes on
# every terraform apply; you would NOT disable this for production hosts,
# because it is what protects against man-in-the-middle attacks.
host_key_checking = False

# Human-readable output instead of the default dense JSON-ish format.
stdout_callback = yaml

# Keep facts (gathered system info) for 24h so repeat runs are faster.
fact_caching = jsonfile
fact_caching_connection = .ansible_cache
fact_caching_timeout = 86400

# Show how long each task took — useful when explaining a run.
callbacks_enabled = profile_tasks

interpreter_python = auto_silent

[ssh_connection]
# Reuse one SSH connection for all tasks on a host instead of reconnecting
# each time. This is the single biggest speed-up for remote plays.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
