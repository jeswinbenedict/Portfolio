###############################################################################
# docker-compose.yml — observability stack for the portfolio
#
# WHAT EACH PIECE DOES
#   portfolio    the application itself, so there is something to observe
#   cadvisor     reads Docker's stats API and exposes per-container CPU,
#                memory, network and disk as Prometheus metrics
#   node-exporter  exposes host-level metrics (load, filesystem, memory)
#   prometheus   SCRAPES those endpoints every 15s and stores the numbers as
#                a time series database. It pulls; nothing pushes to it.
#   loki         the same idea for LOGS rather than metrics. Far lighter than
#                Elasticsearch because it indexes only labels, not full text.
#   promtail     tails container log files and ships them to Loki
#   grafana      the UI. Queries Prometheus and Loki and draws dashboards.
#
# WHY LOKI AND NOT ELASTICSEARCH HERE
#   Both are provided. Elasticsearch (see ../elk) needs roughly 4 GB of RAM on
#   its own; this whole stack runs in about 1 GB. Use this one day to day and
#   start ELK only when you specifically need to demonstrate ELK.
#
# RUN IT
#   docker compose up -d
#   Grafana      http://localhost:3001   (admin / admin)
#   Prometheus   http://localhost:9090
#   Portfolio    http://localhost:3000
###############################################################################

services:
  # --------------------------------------------------------------------------
  # The application under observation
  # --------------------------------------------------------------------------
  portfolio:
    image: jechuimmanuel/portfolio:v3
    # OAuth secrets injected at runtime from the project env file. required:
    # false keeps the stack startable without it (login shows "not configured").
    env_file:
      - path: ../../.env.local
        required: false
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - observability
    # Tag the logs so Promtail/Loki can filter by application.
    labels:
      app: "portfolio"

  # --------------------------------------------------------------------------
  # cAdvisor — container metrics
  #
  # The volume mounts are read-only windows onto the host so cAdvisor can read
  # the cgroup and Docker state that describe running containers.
  # --------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - observability

  # --------------------------------------------------------------------------
  # node-exporter — host metrics
  # --------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Prometheus — metric collection and storage
  #
  # Its config (prometheus/prometheus.yml) lists the endpoints to scrape.
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Keep 7 days of history; the default 15 days fills a laptop disk.
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle" # allows config reload without a restart
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Loki — log aggregation
  # --------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Promtail — reads container logs and pushes them to Loki
  # --------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Grafana — the dashboards
  #
  # Datasources and dashboards are "provisioned": defined as files so the stack
  # comes up already configured instead of needing manual clicking. That makes
  # the demo repeatable.
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      # 3001 on the host, because the portfolio already uses 3000.
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      # Skip the "check for updates" call so it starts cleanly offline.
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - observability

# ----------------------------------------------------------------------------
# Named volumes keep the databases when containers are recreated. Without
# these, every `docker compose down` would discard all collected history.
# ----------------------------------------------------------------------------
volumes:
  prometheus-data:
  grafana-data:
  loki-data:

# ----------------------------------------------------------------------------
# A user-defined bridge network gives the containers DNS: Prometheus can reach
# cAdvisor at the hostname "cadvisor" rather than an IP address.
# ----------------------------------------------------------------------------
networks:
  observability:
    driver: bridge
