###############################################################################
# portfolio.conf — nginx reverse proxy for the portfolio container
#
# WHY A REVERSE PROXY AT ALL
#   Right now the app answers on http://<ip>:3000. Three problems with that:
#     1. Visitors must type a port number; a real site answers on 80/443.
#     2. The Node process would have to run as root to bind port 80.
#     3. TLS certificates, redirects, caching and rate limiting all have to be
#        reimplemented inside the app.
#   nginx sits in front, listens on 80/443, and forwards to 127.0.0.1:3000.
#   The container never needs to be exposed to the internet directly.
#
# INSTALL ON THE EC2 INSTANCE
#   sudo apt-get update && sudo apt-get install -y nginx
#   sudo cp portfolio.conf /etc/nginx/sites-available/portfolio
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # drop the "Welcome" page
#   sudo nginx -t          # ALWAYS test before reloading
#   sudo systemctl reload nginx
#
# THEN ADD HTTPS (after DNS points at this server):
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#   Certbot edits this file in place to add the TLS block and the redirect,
#   and installs a systemd timer that renews every 60 days.
###############################################################################

server {
    listen 80;
    listen [::]:80;

    # Replace with your real domain once purchased. The special value `_`
    # matches any hostname, which is what lets this work by bare IP today.
    server_name yourdomain.com www.yourdomain.com;

    # ---------------------------------------------------------------------
    # Security headers — cheap, and your examiner may well ask about them.
    # ---------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;            # clickjacking
    add_header X-Content-Type-Options "nosniff" always;        # MIME sniffing
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Do not advertise the nginx version in error pages / headers.
    server_tokens off;

    # Next.js serves pre-compressed assets; let nginx compress the rest.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        # The container, published on the host's loopback interface only.
        proxy_pass http://127.0.0.1:3000;

        # -----------------------------------------------------------------
        # Without these, the application sees every request as coming from
        # nginx itself (127.0.0.1) over http, and would build wrong absolute
        # URLs and log useless client addresses.
        # -----------------------------------------------------------------
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Required for WebSocket upgrades (Next.js uses them in dev mode).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Fail fast rather than hanging if the container is down.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        # Pass 502/504 straight through instead of buffering the whole
        # response first — better perceived latency for streamed pages.
        proxy_buffering off;
    }

    # ---------------------------------------------------------------------
    # Next.js fingerprints files under /_next/static with a content hash, so
    # they can be cached forever: a change produces a new filename.
    # ---------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A trivial endpoint for uptime checks and load balancers.
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
